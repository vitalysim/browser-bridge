name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            extension/package-lock.json

      - name: Build and test the server
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: Typecheck and build the extension
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

  # End-to-end: the real server + the real MV3 extension in Playwright's bundled Chromium, driven over
  # MCP (see e2e/README.md). Extensions need a headed browser context, hence xvfb. Runs on one Node
  # version only - it exercises the browser path, not the Node matrix.
  e2e:
    name: e2e (chromium, node 22)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            extension/package-lock.json
            e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright-core install --with-deps chromium

      - name: Install recording export dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run the e2e suite
        working-directory: e2e
        run: xvfb-run --auto-servernum -- npm test

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/.artifacts
          include-hidden-files: true
          retention-days: 7
