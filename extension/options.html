<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Browser Bridge</title>
  <style>
    body { font: 14px/1.5 -apple-system, system-ui, sans-serif; margin: 16px; min-width: 320px; color: #222; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; border: 1px solid #bbb; border-radius: 6px; }
    button { margin-top: 12px; padding: 6px 14px; font: inherit; border: 1px solid #888; border-radius: 6px; background: #f5f5f5; cursor: pointer; }
    button:hover { background: #eee; }
    #status { margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: #f0f0f0; }
    #status.connected { background: #e2f5e5; color: #1a6b2a; }
    #status.disconnected, #status.no-token { background: #fdeaea; color: #8f2020; }
    #status.connecting { background: #fdf6e2; color: #7a5b12; }
    .hint { color: #666; font-size: 12px; margin-top: 8px; }
    code { background: #f0f0f0; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Browser Bridge</h1>
  <div id="status">status: unknown</div>
  <label for="token">Server token</label>
  <input id="token" type="text" placeholder="paste token from ~/.browser-bridge/token" autocomplete="off">
  <label for="port">Server port</label>
  <input id="port" type="number" value="8765">
  <button id="save">Save &amp; connect</button>
  <p class="hint">The token is printed when the bridge server starts, and stored in <code>~/.browser-bridge/token</code>.</p>
  <script src="options.js"></script>
</body>
</html>
