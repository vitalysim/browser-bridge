<!doctype html>
<html><head><meta charset="utf-8"><title>pointerdown menu</title>
<style>[role=menu]{border:1px solid #888;padding:4px;margin:4px 0}[hidden]{display:none}</style></head>
<body>
<h1>Pointerdown menus</h1>
<!-- Radix DropdownMenu.Trigger: opens on pointerdown (left button, no ctrl), NOT on click. -->
<button id="pd-trigger" type="button" aria-haspopup="menu" aria-expanded="false">Options (pointerdown)</button>
<div id="pd-menu" role="menu" hidden><div role="menuitem">Edit</div><div role="menuitem">Delete</div></div>
<!-- Older menu libraries: open on mousedown only. -->
<button id="md-trigger" type="button" aria-haspopup="menu" aria-expanded="false">Actions (mousedown)</button>
<div id="md-menu" role="menu" hidden><div role="menuitem">Rename</div></div>
<script>
  window.__state = { pdOpen: false, mdOpen: false, events: [] };
  const pd = document.getElementById("pd-trigger");
  pd.addEventListener("pointerdown", (e) => {
    window.__state.events.push("pointerdown");
    if (e.button === 0 && e.ctrlKey === false) {
      window.__state.pdOpen = !window.__state.pdOpen;
      document.getElementById("pd-menu").hidden = !window.__state.pdOpen;
      pd.setAttribute("aria-expanded", String(window.__state.pdOpen));
      e.preventDefault();
    }
  });
  pd.addEventListener("click", () => window.__state.events.push("click"));
  const md = document.getElementById("md-trigger");
  md.addEventListener("mousedown", (e) => {
    window.__state.events.push("mousedown");
    if (e.button !== 0) return;
    window.__state.mdOpen = !window.__state.mdOpen;
    document.getElementById("md-menu").hidden = !window.__state.mdOpen;
    md.setAttribute("aria-expanded", String(window.__state.mdOpen));
  });
</script>
</body></html>
