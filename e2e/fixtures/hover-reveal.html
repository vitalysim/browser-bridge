<!doctype html>
<html><head><meta charset="utf-8"><title>hover reveal</title>
<style>
  .card { width: 300px; height: 80px; border: 1px solid #888; margin: 20px; padding: 8px; }
  /* marimo-style: the per-cell toolbar button is 0x0 until the cell is :hover'ed */
  .card .tool { width: 0; height: 0; padding: 0; border: 0; overflow: hidden; display: inline-block; }
  .card:hover .tool { width: 60px; height: 24px; border: 1px solid #333; }
</style></head>
<body>
<div class="card" id="cell-1" data-testid="cell">
  <span>print("hello")</span>
  <button class="tool" id="run-cell" type="button">Run</button>
</div>
<script>
  window.__ran = 0;
  document.getElementById("run-cell").addEventListener("click", () => window.__ran++);
</script>
</body></html>
