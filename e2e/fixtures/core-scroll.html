<!doctype html><html><head><meta charset="utf-8"><title>Core Scroll</title>
<style>
  body { margin: 0; }
  #top { height: 200px; }
  #pane { height: 200px; width: 300px; overflow-y: auto; border: 1px solid #333; }
  #pane .row { height: 50px; }
  #spacer { height: 3000px; background: linear-gradient(#fff, #ddd); }
</style></head>
<body>
<div id="top">top area</div>
<div id="pane">
  <button id="pane-btn">Row 0 button</button>
  <div class="row">row 1</div><div class="row">row 2</div><div class="row">row 3</div><div class="row">row 4</div>
  <div class="row">row 5</div><div class="row">row 6</div><div class="row">row 7</div><div class="row">row 8</div>
  <div class="row">row 9</div><div class="row" id="pane-last">row 10 (last)</div>
</div>
<div id="spacer"></div>
<button id="far">Far button</button>
<div style="height:100px"></div>
</body></html>
