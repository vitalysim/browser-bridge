<html><head><meta charset="utf-8"><title>duplicate selector</title>
<style>nav.mobile{display:none}</style></head>

<main><h1>Newsletter</h1><input name="email" id="desktop-email" placeholder="Email (desktop)"></main>
<iframe id="frame" src="dup-frame.html" width="400" height="80"></iframe>
</body></html>
