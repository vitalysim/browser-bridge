<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 676" width="720" height="676" role="img" aria-label="Architecture: Claude Code and Codex CLI connect over streamable-HTTP MCP to the bridge server, which relays over an outbound token-authed WebSocket to the Chrome MV3 extension, which drives your real logged-in tabs.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="0.55" stop-color="#141417"/>
      <stop offset="1" stop-color="#0c0c0f"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="720" height="676" rx="18" fill="url(#card)"/>
  <rect x="0.75" y="0.75" width="718.5" height="674.5" rx="17.25" fill="none" stroke="#2a2a31" stroke-width="1.5"/>

  <!-- ===== node: clients ===== -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="100" y="36" width="520" height="82" rx="12" fill="#17171b" stroke="#303038" stroke-width="1.5"/>
    <!-- chip: Claude Code -->
    <rect x="181" y="58" width="168" height="38" rx="19" fill="#232329" stroke="#3a3a42" stroke-width="1.5"/>
    <text x="265" y="82" text-anchor="middle" font-size="16" font-weight="600" fill="#e4e4e7">Claude Code</text>
    <!-- chip: Codex CLI -->
    <rect x="371" y="58" width="168" height="38" rx="19" fill="#232329" stroke="#3a3a42" stroke-width="1.5"/>
    <text x="455" y="82" text-anchor="middle" font-size="16" font-weight="600" fill="#e4e4e7">Codex CLI</text>
  </g>

  <!-- arrow 1 -->
  <g stroke="#52525b" stroke-width="2" fill="#52525b">
    <line x1="360" y1="118" x2="360" y2="190"/>
    <path d="M 360 192 L 353 180 L 367 180 Z" stroke="none"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="392" y="150" font-size="13" fill="#a1a1aa">streamable-HTTP MCP</text>
    <text x="392" y="172" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#71717a">127.0.0.1:8765/mcp</text>
  </g>

  <!-- ===== node: bridge server ===== -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="100" y="196" width="520" height="104" rx="12" fill="#17171b" stroke="#303038" stroke-width="1.5"/>
    <text x="128" y="224" font-size="11" letter-spacing="2.5" font-weight="600" fill="#71717a">NODE · TYPESCRIPT</text>
    <text x="128" y="254" font-size="23" font-weight="700" fill="#f4f4f5">Bridge server</text>
    <text x="128" y="284" font-size="15" fill="#a1a1aa">MCP tools + auth &#160;&#160;·&#160;&#160; WS hub (request / response)</text>
  </g>

  <!-- arrow 2 -->
  <g stroke="#52525b" stroke-width="2" fill="#52525b">
    <line x1="360" y1="300" x2="360" y2="378"/>
    <path d="M 360 380 L 353 368 L 367 368 Z" stroke="none"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="392" y="334" font-size="13" fill="#a1a1aa">outbound WebSocket · token-authed</text>
    <text x="392" y="356" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#71717a">ws://127.0.0.1:8765/ws</text>
  </g>

  <!-- ===== node: chrome extension ===== -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="100" y="384" width="520" height="118" rx="12" fill="#17171b" stroke="#303038" stroke-width="1.5"/>
    <text x="128" y="410" font-size="11" letter-spacing="2.5" font-weight="600" fill="#71717a">MANIFEST V3 EXTENSION</text>
    <text x="128" y="440" font-size="23" font-weight="700" fill="#f4f4f5">Chrome extension</text>
    <text x="128" y="468" font-size="14" fill="#a1a1aa"><tspan fill="#8a8a93">default -</tspan> chrome.tabs · scripting · capture · rrweb recorder &#160;<tspan fill="#8a8a93">(banner-free)</tspan></text>
    <text x="128" y="490" font-size="14" fill="#a1a1aa"><tspan fill="#8a8a93">opt-in -</tspan> chrome.debugger · Network · Fetch · DOM &#160;<tspan fill="#8a8a93">(CDP)</tspan></text>
  </g>

  <!-- arrow 3 -->
  <g stroke="#52525b" stroke-width="2" fill="#52525b">
    <line x1="360" y1="502" x2="360" y2="558"/>
    <path d="M 360 560 L 353 548 L 367 548 Z" stroke="none"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="392" y="536" font-size="13" fill="#a1a1aa">drives the live page</text>
  </g>

  <!-- ===== node: real tabs ===== -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="100" y="564" width="520" height="80" rx="12" fill="#141417" stroke="#2a2a31" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="128" y="600" font-size="19" font-weight="700" fill="#e4e4e7">Your real, logged-in tabs</text>
    <text x="128" y="624" font-size="13.5" fill="#8a8a93">Gmail · GitHub · your live, authenticated sessions</text>
  </g>
</svg>
